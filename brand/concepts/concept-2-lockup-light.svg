<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 180" width="760" height="180" role="img" aria-label="NeuroNest — Concept 2 Horizontal Lockup (Light)">
  <title>NeuroNest — Concept 2 (Light)</title>
  <!-- Concept 2: The Orbit Cradle (Horizontal Lockup - Light Background) -->
  <defs>
    <style>
      .brand-title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", "Helvetica Neue", sans-serif;
        font-size: 64px;
        font-weight: 700;
        letter-spacing: -1.5px;
        fill: #0F172A;
      }
      .brand-accent {
        fill: #4F46E5;
      }
      .brand-tagline {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", "Helvetica Neue", sans-serif;
        font-size: 16px;
        font-weight: 500;
        letter-spacing: 0.5px;
        fill: #64748B;
      }
    </style>
  </defs>

  <!-- Symbol -->
  <g transform="translate(25, 25) scale(0.5078)" fill="none">
    <!-- Outer Embracing Arc -->
    <path d="M 44 116
             C 44 180, 82 220, 128 220
             C 174 220, 212 180, 212 116"
          stroke="#4F46E5"
          stroke-width="26"
          stroke-linecap="round" />
    <!-- Inner Supportive Arc -->
    <path d="M 78 132
             C 78 168, 100 188, 128 188
             C 156 188, 178 168, 178 132"
          stroke="#818CF8"
          stroke-width="20"
          stroke-linecap="round" />
    <!-- Initiation Spark -->
    <circle cx="128" cy="80" r="22" fill="#F59E0B" />
    <!-- Momentum Notch -->
    <path d="M 128 42 L 128 52" stroke="#F59E0B" stroke-width="8" stroke-linecap="round" opacity="0.9" />
  </g>

  <!-- Wordmark -->
  <text x="190" y="104" class="brand-title">Neuro<tspan class="brand-accent">Nest</tspan></text>
  <text x="192" y="136" class="brand-tagline">TURN MENTAL CLUTTER INTO CALM ACTION</text>
</svg>
