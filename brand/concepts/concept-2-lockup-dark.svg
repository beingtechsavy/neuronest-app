<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 180" width="760" height="180" role="img" aria-label="NeuroNest — Concept 2 Horizontal Lockup (Dark)">
  <title>NeuroNest — Concept 2 (Dark)</title>
  <!-- Concept 2: The Orbit Cradle (Horizontal Lockup - Dark Background) -->
  <defs>
    <style>
      .brand-title-dark {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", "Helvetica Neue", sans-serif;
        font-size: 64px;
        font-weight: 700;
        letter-spacing: -1.5px;
        fill: #F8FAFC;
      }
      .brand-accent-dark {
        fill: #818CF8;
      }
      .brand-tagline-dark {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", "Helvetica Neue", sans-serif;
        font-size: 16px;
        font-weight: 500;
        letter-spacing: 0.5px;
        fill: #94A3B8;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="760" height="180" rx="16" fill="#0B0F19" />

  <!-- Symbol -->
  <g transform="translate(25, 25) scale(0.5078)" fill="none">
    <!-- Outer Embracing Arc -->
    <path d="M 44 116
             C 44 180, 82 220, 128 220
             C 174 220, 212 180, 212 116"
          stroke="#6366F1"
          stroke-width="26"
          stroke-linecap="round" />
    <!-- Inner Supportive Arc -->
    <path d="M 78 132
             C 78 168, 100 188, 128 188
             C 156 188, 178 168, 178 132"
          stroke="#A5B4FC"
          stroke-width="20"
          stroke-linecap="round" />
    <!-- Initiation Spark -->
    <circle cx="128" cy="80" r="22" fill="#FBBF24" />
    <!-- Momentum Notch -->
    <path d="M 128 42 L 128 52" stroke="#FBBF24" stroke-width="8" stroke-linecap="round" opacity="0.9" />
  </g>

  <!-- Wordmark -->
  <text x="190" y="104" class="brand-title-dark">Neuro<tspan class="brand-accent-dark">Nest</tspan></text>
  <text x="192" y="136" class="brand-tagline-dark">TURN MENTAL CLUTTER INTO CALM ACTION</text>
</svg>
