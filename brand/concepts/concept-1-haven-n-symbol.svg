<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="NeuroNest — Concept 1: The Haven N">
  <title>NeuroNest — Concept 1: The Haven N</title>
  <!--
    Concept 1: The Haven N (Architectural Monogram)
    Two vertical pillars framing an inner sheltering cradle that forms the diagonal of the N.
    The left stem is grounded; the diagonal sweeps with a gentle cradling curve that holds a calm
    focal center (the intention seed), rising smoothly into the right pillar.
  -->
  <g fill="none">
    <!-- Left Pillar -->
    <rect x="44" y="36" width="44" height="184" rx="12" fill="#0F172A" />

    <!-- Right Pillar -->
    <rect x="168" y="36" width="44" height="184" rx="12" fill="#0F172A" />

    <!-- Sheltering Diagonal: An organic, supportive bridge that bows into a nest -->
    <path d="M 88 56
             C 108 64, 128 92, 142 128
             C 156 164, 164 190, 168 204
             L 168 174
             C 156 142, 142 112, 126 84
             C 114 62, 102 48, 88 40
             Z" fill="#0D9488" />

    <!-- The Haven Seed: The calm focus point nestled in the center -->
    <circle cx="128" cy="116" r="18" fill="#14B8A6" />
  </g>
</svg>
