<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 160" width="680" height="160" role="img" aria-labelledby="title-lockup-light">
  <title id="title-lockup-light">NeuroNest — Primary Horizontal Logo (Light Backgrounds)</title>
  <defs>
    <style>
      .wordmark-neuro {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", "Helvetica Neue", sans-serif;
        font-size: 58px;
        font-weight: 700;
        letter-spacing: -1.2px;
        fill: #0F172A;
      }
      .wordmark-nest {
        fill: #0D9488;
      }
      .tagline-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", "Helvetica Neue", sans-serif;
        font-size: 13.5px;
        font-weight: 600;
        letter-spacing: 1.2px;
        fill: #64748B;
      }
    </style>
  </defs>

  <!-- Symbol: Optically centered to cap-height, positioned at x=20, y=20 -->
  <g id="symbol" transform="translate(20, 20) scale(0.46875)">
    <!-- Left Pillar -->
    <rect x="44" y="36" width="44" height="184" rx="12" fill="#0F172A" />

    <!-- Right Pillar -->
    <rect x="168" y="36" width="44" height="184" rx="12" fill="#0F172A" />

    <!-- Sheltering Diagonal Bridge -->
    <path d="M 88 56
             C 108 64, 128 92, 142 128
             C 156 164, 164 190, 168 204
             L 168 174
             C 156 142, 142 112, 126 84
             C 114 62, 102 48, 88 40
             Z" fill="#0D9488" />

    <!-- The Haven Seed -->
    <circle cx="128" cy="116" r="18" fill="#14B8A6" />
  </g>

  <!-- Wordmark -->
  <g id="wordmark">
    <text x="160" y="92" class="wordmark-neuro">Neuro<tspan class="wordmark-nest">Nest</tspan></text>
    <text x="162" y="120" class="tagline-text">ATTENTION &amp; FOCUS SCAFFOLDING</text>
  </g>
</svg>
