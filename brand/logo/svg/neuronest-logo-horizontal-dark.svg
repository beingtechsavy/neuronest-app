<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 160" width="680" height="160" role="img" aria-labelledby="title-lockup-dark">
  <title id="title-lockup-dark">NeuroNest — Primary Horizontal Logo (Dark Backgrounds)</title>
  <defs>
    <style>
      .wordmark-neuro-dark {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", "Helvetica Neue", sans-serif;
        font-size: 58px;
        font-weight: 700;
        letter-spacing: -1.2px;
        fill: #F8FAFC;
      }
      .wordmark-nest-dark {
        fill: #2DD4BF;
      }
      .tagline-text-dark {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", "Helvetica Neue", sans-serif;
        font-size: 13.5px;
        font-weight: 600;
        letter-spacing: 1.2px;
        fill: #94A3B8;
      }
    </style>
  </defs>

  <!-- Symbol: Tuned for dark contrast -->
  <g id="symbol" transform="translate(20, 20) scale(0.46875)">
    <!-- Left Pillar (Clean Light) -->
    <rect x="44" y="36" width="44" height="184" rx="12" fill="#F8FAFC" />

    <!-- Right Pillar -->
    <rect x="168" y="36" width="44" height="184" rx="12" fill="#F8FAFC" />

    <!-- Sheltering Diagonal Bridge -->
    <path d="M 88 56
             C 108 64, 128 92, 142 128
             C 156 164, 164 190, 168 204
             L 168 174
             C 156 142, 142 112, 126 84
             C 114 62, 102 48, 88 40
             Z" fill="#14B8A6" />

    <!-- The Haven Seed -->
    <circle cx="128" cy="116" r="18" fill="#2DD4BF" />
  </g>

  <!-- Wordmark -->
  <g id="wordmark">
    <text x="160" y="92" class="wordmark-neuro-dark">Neuro<tspan class="wordmark-nest-dark">Nest</tspan></text>
    <text x="162" y="120" class="tagline-text-dark">ATTENTION &amp; FOCUS SCAFFOLDING</text>
  </g>
</svg>
