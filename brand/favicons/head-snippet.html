<!-- NeuroNest Next.js Favicon & PWA Metadata Snippet -->
<!-- Place inside <head> or use in Next.js 14+ app/layout.tsx metadata object -->

<!-- Standard SVG Favicon (Modern Browsers, dark/light adaptive) -->
<link rel="icon" href="/brand/favicons/favicon.svg" type="image/svg+xml">

<!-- Fallback ICO for legacy browsers -->
<link rel="alternate icon" href="/favicon.ico">

<!-- Apple Touch Icon (iOS Home Screen) -->
<link rel="apple-touch-icon" sizes="180x180" href="/brand/favicons/apple-touch-icon.png">

<!-- Web App Manifest (PWA & Android Home Screen) -->
<link rel="manifest" href="/brand/favicons/site.webmanifest">

<!-- Browser Theme Colors -->
<meta name="theme-color" content="#0D9488" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F172A" media="(prefers-color-scheme: dark)">

<!-- OpenGraph / Social Share Icon -->
<meta property="og:image" content="/brand/logo/png/neuronest-symbol-512.png">
<meta name="twitter:card" content="summary">
<meta name="twitter:image" content="/brand/logo/png/neuronest-symbol-512.png">
