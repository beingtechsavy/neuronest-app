<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NeuroNest — Animated Project Showcase</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #020617;
      color: #fff;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { width: min(100vw, 1280px); padding: 22px; }
    canvas {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      border: 1px solid rgba(196, 181, 253, .24);
      border-radius: 18px;
      box-shadow: 0 24px 90px rgba(76, 29, 149, .32);
      background: #020617;
    }
    .controls { display: flex; gap: 12px; align-items: center; margin-top: 14px; }
    button {
      border: 0; border-radius: 999px; padding: 11px 18px; cursor: pointer;
      color: #170b2f; background: #fde68a; font-weight: 800; letter-spacing: .01em;
    }
    button.secondary { color: #ede9fe; background: rgba(139, 92, 246, .18); border: 1px solid rgba(196, 181, 253, .28); }
    button:disabled { opacity: .55; cursor: wait; }
    #status { color: #c4b5fd; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <canvas id="brag" width="1280" height="720" aria-label="Animated NeuroNest project showcase preview"></canvas>
    <div class="controls">
      <button id="record">Export video</button>
      <button id="replay" class="secondary">Replay preview</button>
      <span id="status">Preview ready · 55 seconds · 16:9</span>
    </div>
  </main>
  <script>
    const canvas = document.getElementById('brag');
    const ctx = canvas.getContext('2d');
    const recordButton = document.getElementById('record');
    const replayButton = document.getElementById('replay');
    const status = document.getElementById('status');
    const W = canvas.width;
    const H = canvas.height;
    const DURATION = 55;
    const FRAME_RATE = 30;
    const narrationAudio = new Audio('/audio/neuronest-narration.mp3');
    const musicAudio = new Audio('/sounds/coffee-shop.mp3');
    narrationAudio.preload = 'auto';
    musicAudio.preload = 'auto';
    musicAudio.loop = true;
    let startedAt = performance.now();
    let raf = 0;
    let audioContext = null;
    let audioDestination = null;
    window.addEventListener('error', (event) => {
      status.textContent = `Render error · ${event.message || 'unknown browser error'}`;
    });
    window.addEventListener('unhandledrejection', (event) => {
      status.textContent = `Render error · ${event.reason?.message || 'audio/render promise rejected'}`;
    });

    const clamp = (n, min = 0, max = 1) => Math.max(min, Math.min(max, n));
    const ease = (n) => { n = clamp(n); return n * n * (3 - 2 * n); };
    const fade = (t, start, end) => ease(clamp((t - start) / (end - start)));
    const smoothstep = (t, a, b) => ease(clamp((t - a) / (b - a)));
    const roundRect = (x, y, w, h, r) => { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.closePath(); };
    const text = (value, x, y, size, color = '#fff', weight = 700, align = 'left') => {
      ctx.font = `${weight} ${size}px Inter, ui-sans-serif, system-ui, sans-serif`;
      ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.fillText(value, x, y);
    };
    const wrap = (value, x, y, maxWidth, lineHeight, size, color = '#fff', weight = 600) => {
      ctx.font = `${weight} ${size}px Inter, ui-sans-serif, system-ui, sans-serif`;
      ctx.fillStyle = color; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
      const words = value.split(' '); let line = ''; let row = 0;
      for (const word of words) {
        const candidate = line ? `${line} ${word}` : word;
        if (ctx.measureText(candidate).width > maxWidth && line) { ctx.fillText(line, x, y + row * lineHeight); row += 1; line = word; }
        else line = candidate;
      }
      if (line) ctx.fillText(line, x, y + row * lineHeight);
    };
    const glowDot = (x, y, radius, color, alpha = 1) => {
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(x, y, radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    };
    const mark = (x, y, scale = 1, alpha = 1) => {
      ctx.save(); ctx.translate(x, y); ctx.scale(scale, scale); ctx.globalAlpha = alpha;
      ctx.fillStyle = '#4c1d95'; roundRect(-52, -52, 104, 104, 28); ctx.fill();
      ctx.strokeStyle = '#ddd6fe'; ctx.lineWidth = 7; ctx.lineCap = 'round';
      [-22, 0, 22].forEach((offset) => { ctx.beginPath(); ctx.arc(0, 8 + offset, 31 - offset / 4, Math.PI * 1.12, Math.PI * 1.88); ctx.stroke(); });
      ctx.fillStyle = '#fde68a'; roundRect(25, 18, 18, 18, 6); ctx.fill(); ctx.restore();
    };
    const chip = (label, x, y, color = '#8b5cf6', alpha = 1) => {
      ctx.save(); ctx.globalAlpha = alpha; ctx.font = '700 16px Inter, sans-serif';
      const width = ctx.measureText(label).width + 32;
      ctx.fillStyle = `${color}22`; ctx.strokeStyle = `${color}99`; ctx.lineWidth = 1;
      roundRect(x, y, width, 38, 19); ctx.fill(); ctx.stroke();
      text(label, x + 16, y + 19, 16, '#ede9fe', 700); ctx.restore();
      return width;
    };
    const cursor = (x, y, alpha = 1, scale = 1) => {
      ctx.save(); ctx.globalAlpha = alpha; ctx.translate(x, y); ctx.scale(scale, scale);
      ctx.fillStyle = '#fff'; ctx.strokeStyle = '#4c1d95'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 34); ctx.lineTo(10, 25); ctx.lineTo(19, 43); ctx.lineTo(27, 39); ctx.lineTo(17, 21); ctx.lineTo(31, 20); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore();
    };
    const linePath = (progress, alpha = 1) => {
      const x0 = 88; const x1 = 1192; const y = 570; const x = x0 + (x1 - x0) * clamp(progress);
      ctx.save(); ctx.globalAlpha = alpha; ctx.lineCap = 'round';
      ctx.strokeStyle = 'rgba(196,181,253,.22)'; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke();
      ctx.strokeStyle = '#8b5cf6'; ctx.lineWidth = 8; ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x, y); ctx.stroke();
      glowDot(x, y, 8, '#fde68a', 1); ctx.restore();
    };
    const node = (x, y, label, selected = false, alpha = 1) => {
      ctx.save(); ctx.globalAlpha = alpha;
      const r = selected ? 42 : 34; ctx.fillStyle = selected ? '#4c1d95' : 'rgba(15,23,42,.82)';
      ctx.strokeStyle = selected ? '#fde68a' : '#8b5cf6'; ctx.lineWidth = selected ? 3 : 2;
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      glowDot(x, y, selected ? 6 : 4, selected ? '#fde68a' : '#a78bfa', 1);
      text(label, x, y + r + 24, 17, selected ? '#fde68a' : '#c4b5fd', 700, 'center'); ctx.restore();
    };
    const background = (t) => {
      ctx.fillStyle = '#020617'; ctx.fillRect(0, 0, W, H);
      const g = ctx.createRadialGradient(245 + Math.sin(t * .25) * 50, 150, 0, 245, 150, 650);
      g.addColorStop(0, 'rgba(139,92,246,.24)'); g.addColorStop(1, 'rgba(2,6,23,0)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      const g2 = ctx.createRadialGradient(1050, 620, 0, 1050, 620, 470);
      g2.addColorStop(0, 'rgba(253,230,138,.09)'); g2.addColorStop(1, 'rgba(2,6,23,0)'); ctx.fillStyle = g2; ctx.fillRect(0, 0, W, H);
      ctx.strokeStyle = 'rgba(196,181,253,.055)'; ctx.lineWidth = 1;
      for (let x = 0; x <= W; x += 64) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
      for (let y = 0; y <= H; y += 64) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
      for (let i = 0; i < 8; i += 1) {
        const x = (i * 173 + t * (9 + i % 3 * 5)) % (W + 120) - 60;
        const y = 90 + ((i * 83) % 530) + Math.sin(t * .8 + i) * 18;
        glowDot(x, y, 1.5, i % 4 === 0 ? '#fde68a' : '#8b5cf6', .3);
      }
    };

    function draw(t) {
      background(t);
      if (t < 6) {
        const p = fade(t, 0, 1.4); mark(92, 92, .55, p); text('NEURONEST', 160, 92, 21, '#c4b5fd', 800);
        text('I know what to do.', 92, 270, 62, '#fff', 850); text('I cannot begin.', 92, 352, 62, '#fde68a', 850);
        const fragments = ['reply', 'study', 'report', 'clean', 'ship'];
        fragments.forEach((label, i) => {
          const x = 690 + Math.cos(t * .8 + i * 1.25) * (150 + i * 8); const y = 300 + Math.sin(t * .9 + i) * (100 + i * 5);
          chip(label, x, y, i === 2 ? '#fde68a' : '#8b5cf6', p * .9);
        });
        const cx = 790 + Math.sin(t * 1.4) * 170; const cy = 330 + Math.cos(t * 1.1) * 90;
        ctx.strokeStyle = 'rgba(253,230,138,.4)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(cx, cy, 28, 0, Math.PI * 2); ctx.stroke(); cursor(cx - 8, cy - 8, p, .8);
        linePath(.08, fade(t, 4.4, 6));
      } else if (t < 12) {
        const p = fade(t, 6, 7.2); text('START WITH THE TASK ALREADY ON YOUR MIND.', 92, 108, 20, '#fde68a', 850);
        text('No setup maze.', 92, 170, 42, '#fff', 850); text('Just a place to begin.', 92, 220, 42, '#c4b5fd', 750);
        const entryP = smoothstep(t, 6.5, 9.5); const fieldX = 92; const fieldY = 330; const fieldW = 1096;
        ctx.save(); ctx.globalAlpha = p; ctx.fillStyle = 'rgba(15,23,42,.72)'; ctx.strokeStyle = '#8b5cf6'; ctx.lineWidth = 2; roundRect(fieldX, fieldY, fieldW, 90, 24); ctx.fill(); ctx.stroke();
        const task = 'Reply to a difficult email'; const chars = Math.floor(task.length * clamp(entryP));
        text(task.slice(0, chars), fieldX + 34, fieldY + 45, 31, '#fff', 700); if (Math.floor(t * 2) % 2 === 0) { ctx.fillStyle = '#fde68a'; ctx.fillRect(fieldX + 35 + ctx.measureText(task.slice(0, chars)).width, fieldY + 25, 3, 39); }
        ctx.restore();
        chip('No account required', 92, 482, '#fde68a', fade(t, 9.2, 10.4));
        linePath(.2 + entryP * .16, p);
      } else if (t < 18) {
        const p = fade(t, 12, 13.2); text('NAME THE FRICTION.', 92, 108, 22, '#fde68a', 850); text('Different resistance needs a different first move.', 92, 158, 36, '#fff', 800);
        const centerX = 640; const centerY = 360; const orbit = 170; const labels = ['too big', 'unclear', 'boring', 'hard to do well'];
        ctx.strokeStyle = 'rgba(167,139,250,.25)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(centerX, centerY, orbit, 0, Math.PI * 2); ctx.stroke();
        labels.forEach((label, i) => { const a = t * .35 + i * Math.PI / 2; node(centerX + Math.cos(a) * orbit, centerY + Math.sin(a) * orbit, label, i === 3, p); });
        glowDot(centerX, centerY, 25, '#8b5cf6', .9); text('the task', centerX, centerY, 21, '#fff', 800, 'center');
        for (let i = 0; i < 5; i += 1) { const a = t * .8 + i * .7; const r = 50 + (i * 17) % 130; glowDot(centerX + Math.cos(a) * r, centerY + Math.sin(a) * r, 2 + i % 2, i % 2 ? '#a78bfa' : '#fde68a', .5); }
        linePath(.37 + fade(t, 16, 18) * .12, p);
      } else if (t < 27) {
        const p = fade(t, 18, 19.5); text('TURN CONTEXT INTO MOTION.', 92, 108, 22, '#fde68a', 850); text('One small, realistic next action.', 92, 160, 46, '#fff', 850);
        const collapse = smoothstep(t, 18.5, 21.8); const xStart = 160; const yStart = 310; const xEnd = 1090; const yEnd = 372;
        ctx.save(); ctx.globalAlpha = p; ctx.strokeStyle = 'rgba(167,139,250,.28)'; ctx.lineWidth = 2;
        for (let i = 0; i < 24; i += 1) { const a = i * .85 + t; const sx = 640 + Math.cos(a) * (300 + i * 3) * (1 - collapse); const sy = 350 + Math.sin(a) * (150 + i * 2) * (1 - collapse); const ex = xEnd - i * 22; const ey = yEnd + Math.sin(i) * 35; ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(ex, ey); ctx.stroke(); glowDot(ex, ey, 2, i % 3 === 0 ? '#fde68a' : '#a78bfa', .6); }
        ctx.restore();
        const actionP = smoothstep(t, 20.4, 23.5); ctx.save(); ctx.globalAlpha = actionP; ctx.fillStyle = 'rgba(15,23,42,.86)'; ctx.strokeStyle = '#fde68a'; ctx.lineWidth = 3; roundRect(120, 280, 1040, 180, 30); ctx.fill(); ctx.stroke();
        text('OPEN THE EMAIL', 170, 335, 24, '#c4b5fd', 800); text('and write one unsent sentence.', 170, 395, 44, '#fff', 850); ctx.restore();
        linePath(.49 + actionP * .14, p);
        const cx = 100 + actionP * 980; cursor(cx, 540, actionP, .85);
      } else if (t < 35) {
        const p = fade(t, 27, 28.3); text('MAKE THE FIRST MOVE VISIBLE.', 92, 108, 22, '#fde68a', 850); text('Press Start. Stay with one step.', 92, 158, 40, '#fff', 820);
        linePath(smoothstep(t, 26.5, 34), p);
        const timer = smoothstep(t, 27.5, 34); const ring = ctx.createRadialGradient(640, 360, 55, 640, 360, 145); ring.addColorStop(0, 'rgba(76,29,149,.5)'); ring.addColorStop(1, 'rgba(2,6,23,0)'); ctx.fillStyle = ring; ctx.beginPath(); ctx.arc(640, 360, 145, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = 'rgba(196,181,253,.25)'; ctx.lineWidth = 16; ctx.beginPath(); ctx.arc(640, 360, 106, 0, Math.PI * 2); ctx.stroke(); ctx.strokeStyle = '#fde68a'; ctx.lineWidth = 16; ctx.beginPath(); ctx.arc(640, 360, 106, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * timer); ctx.stroke();
        text('START', 640, 350, 31, '#fff', 900, 'center'); text('2 MINUTES', 640, 397, 18, '#c4b5fd', 800, 'center');
        for (let i = 0; i < 10; i += 1) { const a = i * Math.PI * 2 / 10 + timer * 2; glowDot(640 + Math.cos(a) * 160, 360 + Math.sin(a) * 160, 3, i % 4 === 0 ? '#fde68a' : '#8b5cf6', .7); }
      } else if (t < 44) {
        const p = fade(t, 35, 36.2); text('WHEN THE STEP DOESN’T FIT, ADAPT.', 92, 108, 22, '#fde68a', 850); text('The task stays. The next move can change.', 92, 158, 38, '#fff', 820);
        const wallX = 660; const wallP = smoothstep(t, 35.2, 37.4); ctx.save(); ctx.globalAlpha = p; ctx.fillStyle = `rgba(239,68,68,${.1 + wallP * .18})`; ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 3; roundRect(wallX, 250, 26, 250, 13); ctx.fill(); ctx.stroke(); ctx.restore();
        const branchP = smoothstep(t, 37, 40); ctx.strokeStyle = '#8b5cf6'; ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(190, 375); ctx.lineTo(wallX, 375); ctx.lineTo(wallX + 190 * branchP, 295); ctx.stroke(); ctx.strokeStyle = '#fde68a'; ctx.beginPath(); ctx.moveTo(wallX, 375); ctx.lineTo(wallX + 190 * branchP, 455); ctx.stroke();
        chip('MAKE IT SMALLER', 780, 254, '#8b5cf6', branchP); chip('TRY A DIFFERENT STEP', 780, 424, '#fde68a', branchP);
        const moveP = smoothstep(t, 39.5, 43.5); glowDot(190 + (wallX - 190) * moveP, 375, 9, '#fff', 1); if (moveP > .55) glowDot(wallX + 190 * (moveP - .55) / .45, moveP < .78 ? 295 : 455, 9, '#fde68a', 1);
        linePath(.72 + moveP * .12, p);
      } else if (t < 51) {
        const p = fade(t, 44, 45.2); text('KEEP THE CONTEXT.', 92, 108, 22, '#fde68a', 850); text('A calm path from stuck to started.', 92, 158, 40, '#fff', 820);
        const points = [{ label: 'task', x: 160 }, { label: 'friction', x: 380 }, { label: 'action', x: 620 }, { label: 'adapt', x: 860 }, { label: 'begin', x: 1100 }];
        ctx.strokeStyle = 'rgba(196,181,253,.25)'; ctx.lineWidth = 4; ctx.beginPath(); points.forEach((point, i) => { if (i === 0) ctx.moveTo(point.x, 365); else ctx.lineTo(point.x, 365); }); ctx.stroke();
        points.forEach((point, i) => { const q = smoothstep(t, 44 + i * 1.0, 45.2 + i * 1.0); glowDot(point.x, 365, 10, q > .5 ? '#fde68a' : '#8b5cf6', q); text(point.label, point.x, 420, 19, q > .5 ? '#fde68a' : '#c4b5fd', 800, 'center'); if (i < points.length - 1 && q > .5) { ctx.strokeStyle = '#8b5cf6'; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(point.x + 18, 365); ctx.lineTo(points[i + 1].x - 18, 365); ctx.stroke(); } });
        chip('anonymous continuity', 92, 520, '#8b5cf6', p); chip('clear state transitions', 320, 520, '#fde68a', p); chip('no account required to start', 590, 520, '#a78bfa', p);
        linePath(.86 + smoothstep(t, 48, 51) * .1, p);
      } else {
        const p = fade(t, 51, 52.5); const scale = .8 + p * .25; mark(640, 242, scale, p);
        text('NEURONEST', 640, 365, 38, '#fff', 900, 'center'); text('One small next action.', 640, 430, 34, '#c4b5fd', 750, 'center'); text('Then begin.', 640, 485, 42, '#fde68a', 900, 'center'); chip('neuronest.work', 540, 565, '#8b5cf6', p);
        for (let i = 0; i < 10; i += 1) { const a = i * .7 + t * .3; glowDot(640 + Math.cos(a) * (230 + i * 4), 360 + Math.sin(a) * (130 + i * 3), 2 + i % 2, i % 3 === 0 ? '#fde68a' : '#8b5cf6', p * .65); }
      }
    }

    function ensureAudioGraph() {
      if (audioContext) return;
      audioContext = new AudioContext(); audioDestination = audioContext.createMediaStreamDestination();
      const narrationSource = audioContext.createMediaElementSource(narrationAudio);
      const musicSource = audioContext.createMediaElementSource(musicAudio);
      const narrationGain = audioContext.createGain(); const musicGain = audioContext.createGain();
      narrationGain.gain.value = 1.0; musicGain.gain.value = 0.11;
      narrationSource.connect(narrationGain); musicSource.connect(musicGain);
      narrationGain.connect(audioDestination); musicGain.connect(audioDestination);
      narrationGain.connect(audioContext.destination); musicGain.connect(audioContext.destination);
    }
    async function startAudio() {
      try { ensureAudioGraph(); await audioContext.resume(); narrationAudio.currentTime = 0; musicAudio.currentTime = 0; await Promise.all([narrationAudio.play(), musicAudio.play()]); }
      catch { status.textContent = 'Preview playing · audio will be included when narration is available'; }
    }
    function stopAudio() { narrationAudio.pause(); musicAudio.pause(); narrationAudio.currentTime = 0; musicAudio.currentTime = 0; }
    function loop(now) { const elapsed = (now - startedAt) / 1000; draw(Math.min(elapsed, DURATION)); if (elapsed < DURATION) raf = requestAnimationFrame(loop); }
    function replay() { cancelAnimationFrame(raf); stopAudio(); startedAt = performance.now(); status.textContent = 'Preview playing · 55 seconds · 16:9'; raf = requestAnimationFrame(loop); startAudio(); setTimeout(() => { stopAudio(); status.textContent = 'Preview ready · click Export video to download'; }, DURATION * 1000 + 100); }
    async function exportVideo() {
      if (!window.MediaRecorder || !canvas.captureStream) { status.textContent = 'This browser cannot export canvas video.'; return; }
      recordButton.disabled = true; replayButton.disabled = true; status.textContent = 'Rendering 55-second motion graphics…';
      stopAudio();
      const stream = canvas.captureStream(FRAME_RATE);
      const chunks = []; const mime = MediaRecorder.isTypeSupported('video/webm;codecs=vp9') ? 'video/webm;codecs=vp9' : 'video/webm';
      const recorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 5000000 });
      recorder.ondataavailable = (event) => { if (event.data.size) chunks.push(event.data); };
      recorder.onstop = () => { const blob = new Blob(chunks, { type: mime }); const url = URL.createObjectURL(blob); const link = document.createElement('a'); link.href = url; link.download = 'neuronest-project-showcase-video.webm'; link.click(); fetch('/upload', { method: 'POST', headers: { 'Content-Type': mime }, body: blob }).then((r) => r.ok ? r.text() : Promise.reject()).then(() => { status.textContent = `Rendered video-only WebM · ${(blob.size / 1024 / 1024).toFixed(1)} MB · saved to workspace`; }).catch(() => { status.textContent = `Rendered video-only WebM · ${(blob.size / 1024 / 1024).toFixed(1)} MB`; }); setTimeout(() => URL.revokeObjectURL(url), 2000); recordButton.disabled = false; replayButton.disabled = false; };
      recorder.start(250);
      let frame = 0;
      const totalFrames = DURATION * FRAME_RATE;
      const interval = setInterval(() => {
        try {
          draw(frame / FRAME_RATE);
          frame += 1;
          if (frame >= totalFrames) {
            clearInterval(interval);
            setTimeout(() => { if (recorder.state !== 'inactive') recorder.stop(); }, 350);
          }
        } catch (error) {
          clearInterval(interval);
          status.textContent = `Render error · ${error?.message || 'canvas error'}`;
          if (recorder.state !== 'inactive') recorder.stop();
        }
      }, 1000 / FRAME_RATE);
    }
    recordButton.addEventListener('click', exportVideo); replayButton.addEventListener('click', replay); replay();
  </script>
</body>
</html>
