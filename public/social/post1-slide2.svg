<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; fill: #F2F3F5; }
      .body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 400; fill: #DBDEE1; }
      .badge { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 700; fill: #2DD4BF; }
      .sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; fill: #949BA4; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 700; fill: #F2F3F5; }
    </style>
  </defs>

  <!-- Discord Dark Background -->
  <rect width="1080" height="1080" fill="#1E1F22" />
  <circle cx="960" cy="120" r="320" fill="#0D9488" opacity="0.12" />

  <!-- Outer frame -->
  <rect x="40" y="40" width="1000" height="1000" rx="36" fill="none" stroke="#383A40" stroke-width="2" />

  <!-- Haven Monogram Mark -->
  <g transform="translate(80, 80) scale(0.35)">
    <rect x="44" y="36" width="44" height="184" rx="12" fill="#F8FAFC" />
    <rect x="168" y="36" width="44" height="184" rx="12" fill="#F8FAFC" />
    <path d="M 88 56 C 108 64, 128 92, 142 128 C 156 164, 164 190, 168 204 L 168 174 C 156 142, 142 112, 126 84 C 114 62, 102 48, 88 40 Z" fill="#14B8A6" />
    <circle cx="128" cy="116" r="18" fill="#2DD4BF" />
  </g>
  <text x="180" y="125" class="title" font-size="36" letter-spacing="-0.5">NeuroNest</text>
  <text x="180" y="152" class="badge" font-size="14" letter-spacing="1.5">TASK INITIATION HAVEN</text>

  <!-- Slide indicator -->
  <rect x="910" y="80" width="90" height="42" rx="21" fill="#2B2D31" stroke="#383A40" stroke-width="1.5" />
  <text x="955" y="108" text-anchor="middle" class="sub" font-size="16" font-weight="700">2 / 3</text>

  <!-- Pill tag -->
  <rect x="80" y="240" width="180" height="40" rx="20" fill="#2B2D31" stroke="#14B8A6" stroke-width="1.5" />
  <text x="170" y="266" text-anchor="middle" class="badge" font-size="15" letter-spacing="1">THE ANTI-PLANNER</text>

  <!-- Main Statement -->
  <text x="80" y="360" class="title" font-size="56" letter-spacing="-1">
    <tspan x="80" dy="0">No backlog.</tspan>
    <tspan x="80" dy="72">No red badges.</tspan>
    <tspan x="80" dy="72" fill="#2DD4BF">Zero guilt streaks.</tspan>
  </text>

  <!-- Feature Card -->
  <rect x="80" y="580" width="920" height="210" rx="24" fill="#2B2D31" stroke="#383A40" stroke-width="2" />
  <rect x="80" y="580" width="14" height="210" rx="7" fill="#0D9488" />
  <text x="130" y="660" class="card-title" font-size="32" letter-spacing="-0.5">
    <tspan x="130" dy="0">NeuroNest Rescue asks just one question:</tspan>
    <tspan x="130" dy="54" fill="#2DD4BF">&ldquo;What are you trying to start?&rdquo;</tspan>
  </text>

  <!-- Subtitle -->
  <text x="80" y="850" class="body" font-size="28" fill="#DBDEE1">
    Name the task. Pick the friction. Get one tailored next action.
  </text>
  <text x="80" y="890" class="sub" font-size="22">
    No account required to break paralysis.
  </text>

  <!-- Footer -->
  <line x1="80" y1="940" x2="1000" y2="940" stroke="#383A40" stroke-width="1.5" />
  <text x="80" y="990" class="sub" font-size="22">neuronest.work/rescue</text>
  <text x="1000" y="990" text-anchor="end" class="badge" font-size="22">Start without friction</text>
</svg>
