<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="og-bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <radialGradient id="teal-glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(300 315) rotate(90) scale(400)">
      <stop stop-color="#0D9488" stop-opacity="0.25" />
      <stop offset="1" stop-color="#0D9488" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="tile-grad" x1="0" y1="0" x2="210" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#og-bg)" />
  <rect width="1200" height="630" fill="url(#teal-glow)" />

  <!-- Subtle ambient decorative circles -->
  <circle cx="1080" cy="60" r="280" fill="#0D9488" opacity="0.06" />
  <circle cx="120" cy="580" r="220" fill="#14B8A6" opacity="0.04" />

  <!-- App Icon Squircle Container -->
  <rect x="108" y="115" width="200" height="200" rx="46" fill="url(#tile-grad)" stroke="#334155" stroke-width="2" />

  <!-- The Haven N Mark inside container -->
  <g transform="translate(108, 115)">
    <g transform="translate(38, 38) scale(0.484)">
      <rect x="44" y="36" width="44" height="184" rx="12" fill="#F8FAFC" />
      <rect x="168" y="36" width="44" height="184" rx="12" fill="#F8FAFC" />
      <path d="M 88 56
               C 108 64, 128 92, 142 128
               C 156 164, 164 190, 168 204
               L 168 174
               C 156 142, 142 112, 126 84
               C 114 62, 102 48, 88 40
               Z" fill="#14B8A6" />
      <circle cx="128" cy="116" r="18" fill="#2DD4BF" />
    </g>
  </g>

  <!-- Brand Title -->
  <text x="350" y="210" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="82" font-weight="800" letter-spacing="-2px">
    Neuro<tspan fill="#2DD4BF">Nest</tspan>
  </text>

  <!-- Tagline & Value Proposition -->
  <text x="354" y="275" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="28" font-weight="600" letter-spacing="1.5px">
    AN ARCHITECTURE FOR ATTENTION &amp; FOCUS
  </text>

  <text x="354" y="340" fill="#F1F5F9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="34" font-weight="700">
    One small next action. Then begin.
  </text>

  <text x="354" y="390" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="23" font-weight="400">
    A supportive task-initiation platform for when starting feels inaccessible.
  </text>

  <!-- Subtle Badge -->
  <rect x="354" y="440" width="220" height="38" rx="8" fill="#0D9488" fill-opacity="0.15" stroke="#0D9488" stroke-opacity="0.4" />
  <text x="464" y="464" fill="#2DD4BF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="14" font-weight="700" letter-spacing="1px" text-anchor="middle">
    ADHD-FRIENDLY SAAS
  </text>
</svg>
