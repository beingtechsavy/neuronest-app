<svg width="512" height="512" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="NeuroNest mark">
  <defs>
    <linearGradient id="nn-tile-bg" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>

  <!-- iOS / App Tile Squircle Container -->
  <rect width="256" height="256" rx="58" fill="url(#nn-tile-bg)" />

  <!-- The Haven N Symbol (Scale: 62%, tx=48.6, ty=48.6) -->
